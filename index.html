<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON DESCENT</title>
<style>
:html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090a12;font-family:Arial,sans-serif;color:#fff;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none}
#top{position:absolute;left:50%;top:18px;transform:translateX(-50%);text-align:center;text-shadow:0 2px 12px #000}
#room{font-size:12px;letter-spacing:4px;color:#7ef7ff}.#health
{position:absolute;left:24px;top:22px;width:260px}#barbg{height:12px;background:#261e30;border:2px solid #fff;border-radius:20px;overflow:hidden}#hp{height:100%;width:100%;background:linear-gradient(90,#ff4b91,#ffb34b);box-shadow:0 0 16px #ff4b91;transition:.15s}#hptext{font-weight:800;margin-top:6px;font-size:13px}
#stats{position:absolute;right:24px;top:20px;text-align:right;font-size:13px;font-weight:800}.gold{color:#ffd66b}.xp{color:#70eaff}
#prompt{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);padding:10px 18px;border:1px solid #ffffff33;background:#10121bcc;border-radius:10px;font-size:13px;display:none}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#080914aa;backdrop-filter:blur(8px);pointer-events:auto}.panel{width:min(760px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;text-align:center;background:linear-gradient(145deg,#17182aee,#0d0f1eee);border:1px solid #65dfff55;border-radius:18px;padding:22px;box-shadow:0 20px 80px #000}h1{margin:4px 0 8px;font-size:32px;letter-spacing:5px;text-shadow:0 0 20px #55efff}h2{margin:6px;color:#9df4ff}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.card{border:1px solid #ffffff22;background:#ffffff08;border-radius:13px;padding:16px 10px;cursor:pointer;min-height:130px;transition:.15s}.card:hover{transform:translateY(-5px);border-color:#73eaff;box-shadow:0 8px 30px #50dfff22}.icon{font-size:36px;height:48px}.card b{display:block;margin:7px;font-size:16px}.card small{color:#c1c6dd;line-height:1.5}.price{color:#ffd66b;font-weight:bold;margin-top:10px}.coins{font-size:20px;color:#ffd66b;margin:10px}.button{border:0;border-radius:9px;background:#65dfff;color:#081018;padding:12px 22px;font-weight:900;cursor:pointer}.button:hover{background:#fff}
#gameover .panel{width:min(430px,calc(100% - 32px))}
#joystick{position:absolute;display:none;width:110px;height:110px;left:22px;bottom:24px;border-radius:50%;border:2px solid #ffffff25;background:#ffffff0b}#stick{position:absolute;width:48px;height:48px;left:31px;top:31px;border-radius:50%;background:#ffffff55}.#shoot{position:absolute;display:none;width:82px;height:82px;right:24px;bottom:34px;border-radius:50%;border:2px solid #ff82b755;background:#ff4b9122;color:#fff;font-weight:900}
@media(max-width:700px){.cards{grid-template-columns:1fr}.card{min-height:85px}.#health{left:14px;top:14px;width:150px}.#stats{right:14px;top:14px}.#joystick,#shoot{display:block}.#prompt{bottom:150px}.panel{padding:14px}h1{font-size:24px}}
</style>
</head><body>
<canvas id="c"></canvas><div id="hud"><div id="top"><div id="room">КОМНАТА 1</div><div id="wave">Волна 1</div></div><div id="health"><div id="barbg"><div id="hp"></div></div><div id="hptext">100 / 100</div></div><div id="stats"><div class="gold">◈ <span id="gold">0</span></div><div class="xp">УРОВЕНЬ <span id="level">1</span></div></div><div id="prompt"></div><div id="joystick"><div id="stick"></div></div><div id="shoot">АТАКА</div></div>
<div id="shop" class="overlay"><div class="panel"><h1>ТОРГОВЕЦ</h1><div class="coins">◈ <span id="shopgold">0</span></div><div class="cards" id="shopcards"></div><button class="button" id="next" style="margin-top:16px">В НОВУЮ КОМНАТУ</button></div></div>
<div id="levelup" class="overlay"><div class="panel"><h1>УРОВЕНЬ!</h1><h2>Выбери улучшение</h2><div class="cards" id="levelcards"></div></div></div>
<div id="gameover" class="overlay"><div class="panel"><h1>ПОГИБ</h1><h2 id="result">Ты дошёл до комнаты 1</h2><button class="button" id="restart">СНАЧАЛА</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{'use strict';
const canvas=document.getElementById('c'),scene=new THREE.Scene();scene.background=new THREE.Color(0x090a12);scene.fog=new THREE.Fog(0x090a12,16,42);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
scene.add(new THREE.HemisphereLight(0x9beeff,0x26091d,1.5));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(8,15,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(48,48),new THREE.MeshStandardMaterial({color:0x171526,roughness:.75,metalness:.15}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
// arena walls
for(let i=-20;i<=20;i+=4){addBlock(i,-21,4,.8,1,0x20243a);addBlock(i,21,4,.8,1,0x20243a);addBlock(-21,i,.8,4,1,0x20243a);addBlock(21,i,.8,4,1,0x20243a)}
function addBlock(x,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.65}));m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
for(let i=-16;i<20;i+=8)for(let j=-16;j<20;j+=8){if(Math.abs(i)<5&&Math.abs(j)<5)continue;if(Math.random()<.35)addBlock(i,j,2.5,Math.random()*1.5+.5,2.5,0x25243b)}
const grid=new THREE.GridHelper(48,24,0x405579,0x252941);grid.position.y=.012;scene.add(grid);
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.65,5,10),new THREE.MeshStandardMaterial({color:0x65eaff,emissive:0x123a44,roughness:.35}));body.position.y=.85;body.castShadow=true;player.add(body);const crest=new THREE.Mesh(new THREE.ConeGeometry(.25,.55,6),new THREE.MeshStandardMaterial({color:0xdffcff,emissive:0x55c8ff}));crest.position.set(0,1.95,0);player.add(crest);scene.add(player);
const keys={},mouse={x:0,y:0,down:false};const bullets=[],enemies=[],particles=[];let room=1,wave=1,gold=0,level=1,xp=0,nextXP=5,shopOpen=false,gameOver=false;
let stats={hp:100,maxhp:100,speed:6,damage:34,fireRate:.38,bulletSpeed:15,multishot:1,pierce:0};
const rand=(a,b)=>a+Math.random*(b-a);
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight,false)}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-(((e.clientY-r.top)/r.height)*2-1)});
canvas.addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);
// touch
const joy=document.getElementById('joystick'),stick=document.getElementById('stick');let joyId=null,jx=0,jy=0;
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);moveJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)moveJoy(e)});function moveJoy(e){const r=joy.getBoundingRect();const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),m=Math.min(l,38),a=Math.atan2(dy,dx);jx=Math.cos(a)*m/38;jy=Math.sin(a)*m/38;stick.style.transform=`translate(${jx*31}px,${jy*31}px)`}for(const ev of ['pointerup','pointercancel'])joy.addEventListener(ev,()=>{joyId=null;jx=0;jy=0;stick.style.transform=''});
document.getElementById('shoot').addPointerCapture?.(null);let touchShoot=false;const shootBtn=document.getElementById('shoot');shootBtn.addEventListener('pointerdown',()=>touchShoot=true);shootBtn.addEventListener('pointerup',()=>touchShoot=false);
function spawnEnemy(){const a=rand(0,Math.PI*2),r=rand(15,19),el=new THREE.Group();const type=Math.random()<.18?'brute':'chaser';const size=type=='brute'?1.15:.65;const mesh=new THREE.Mesh(new THREE.IcosahedronGeometry(size,1),new THREE.MeshStandardMaterial({color:type=='brute'?0xff6b8a:0xffa33b,emissive:type=='brute'?0x5a1025:0x4f2600,roughness:.4}));mesh.castShadow=true;el.add(mesh);const eye=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),new THREE.MeshBasicMaterial({color:0xffffff}));eye.position.set(.28,0.15,.55);el.add(eye);el.position.set(Math.cos(a)*r,.7+size*.2,Math.sin(a)*r);el.userData={hp:type=='brute'?100+room*14:45+room*8,maxhp:type=='brute'?100+room*14:45+room*8,speed:type=='brute'?1.8+room*.07:3.2+room*.12,type,hit:0};scene.add(el);enemies.push(el)}
let toSpawn=4+room*2,lastShot=0;
function startWave(){toSpawn=4+room*2+wave*2;for(let i=0;i<toSpawn;i++)setTimeout(()=>{if(!gameOver&&!shopOpen)spawnEnemy()},i*180)}
startWave();
function shoot(dir){if(performance.now()/1000-lastShot<stats.fireRate)return;lastShot=performance.now()/1000;const count=stats.multishot;for(let i=0;i<count;i++){const spread=count>1?(i-(count-1)/2)*.16:0;const d=new THREE.Vector3(dir.x,0,dir.z).applyAxisAngle(new THREE.Vector3(0,1,0),spread).normalize();const b=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),new THREE.MeshBasicMaterial({color:0x8ffcff}));b.position.copy(player.position);b.position.y=1;b.userData={vel:d.multiplyScalar(stats.bulletSpeed),life:2,pierce:stats.pierce,damage:stats.damage};scene.add(b);bullets.push(b)}}
function burst(pos,color,count=8){for(let i=0;i<count;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(.07,.07,.07),new THREE.MeshBasicMaterial({color,transparent:true}));p.position.copy(pos);p.position.y=1;p.userData={vel:new THREE.Vector3(rand(-3,3),rand(1,4),rand(-3,3)),life:rand(.25,.6)};scene.add(p);particles.push(p)}}
function openShop(){shopOpen=true;document.getElementById('shop').style.display='flex';document.getElementById('shopgold').textContent=gold;const cards=[['⚔','Острые зубья','+12 урона',45,'damage'],['❤','Кровавый сердечник','+30 максимального HP',50,'hp'],['➶','Скоростные ноги','+18% к скорости',42,'speed'],['✦','Двойной выстрел','Снарядов больше на 1',75,'multishot'],['⌁','Быстрый затвор','Стрельба на 20% чаще',55,'firerate'],['◆','Пронзание','Снаряд пробивает врага',70,'pierce']];const el=document.getElementById('shopcards');el.innerHTML='';cards.sort(()=>Math.random-.5).slice(0,3).forEach(c=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="icon">${c[0]}</div><b>${c[1]}</b><small>${c[2]}</small><div class="price">◈ ${c[3]}</div>`;d.onclick=()=>{if(gold>=c[3]){gold-=c[3];apply(c[4]);document.getElementById('shopgold').textContent=gold;document.getElementById('gold').textContent=gold;d.style.opacity=.35;d.onclick=null}};el.appendChild(d)})}
function apply(t){if(t=='damage')stats.damage+=12;if(t=='hp'){stats.maxhp+=30;stats.hp+=30}if(t=='speed')stats.speed*=1.18;if(t=='multishot')stats.multishot++;if(t=='firerate')stats.fireRate*=.8;if(t=='pierce')stats.pierce++;updateHUD()}
document.getElementById('next').onclick=()=>{document.getElementById('shop').style.display='none';shopOpen=false;room++;wave=1;for(const e of enemies){scene.remove(e)}enemies.length=0;player.position.set(0,0,0);toSpawn=4+room*2;startWave();updateHUD()};
const levelCards=[['⚔','Ярость','+20 урона','damage'],['❤','Стойкость','+25 макс. HP','hp'],['➶','Быстрые ноги','+12% скорости','speed'],['⌁','Торопливость','Стрельба на 15% чаще','firerate'],['✦','Двойной залп','Ещё один снаряд','multishot']];function openLevel(){const el=document.getElementById('levelcards');el.innerHTML='';levelCards.sort(()=>Math.random-.5).slice(0,3).forEach(c=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="icon">${c[0]}</div><b>${c[1]}</b><small>${c[2]}</small>`;d.onclick=()=>{apply(c[3]);document.getElementById('levelup').style.display='none'};el.appendChild(d)});document.getElementById('levelup').style.display='flex'}
function updateHUD(){document.getElementById('hp').style.width=(stats.hp/stats.maxhp*100)+'%';document.getElementById('hptext').textContent=Math.ceil(stats.hp)+' / '+stats.maxhp;document.getElementById('gold').textContent=gold;document.getElementById('level').textContent=level;document.getElementById('room').textContent='КОМНАТА '+room;document.getElementById('wave').textContent='Волна '+wave}
function gameEnd(){gameOver=true;document.getElementById('result').textContent=`Ты дошёл до комнаты ${room} · уровень ${level}`;document.getElementById('gameover').style.display='flex'}document.getElementById('restart').onclick=()=>location.reload();
function rayMouseDir(){const ray=new THREE.Raycaster();ray.setFromCamera(mouse, camera);const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);const p=new THREE.Vector3();ray.ray.intersectPlane(plane,p);return p.sub(player.position).setY(0).normalize()}
let last=performance.now(),cl=0;function animate(now){requestAnimationFrame(animate);const dt=Math.min(.033,(now-last)/1000);last=now;if(!gameOver&&!shopOpen&&document.getElementById('levelup').style.display!='flex'){cl+=dt;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+jx,dz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+jy;const l=Math.hypot(dx,dz);if(l>1){dx/=l;dz/=l}player.position.x+=dx*stats.speed*dt;player.position.z+=dz*stats.speed*dt;player.position.x=Math.max(-19,Math.min(19,player.position.x));player.position.z=Math.max(-19,Math.min(19,player.position.z));if(l>.1)player.rotation.y=Math.atan2(dx,dz);let dir;if(touchShoot)dir=new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y));else if(mouse.down)dir=rayMouseDir();if(dir&&dir.lengthSq>.1)shoot(dir);
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.position.addScaledVector(b.userData.vel,dt);b.userData.life-=dt;let remove=false;for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(b.position.distanceTo(e.position)<.9+e.scale.x*.3){e.userData.hp-=b.userData.damage;burst(e.position,0x78efff,3);if(e.userData.hp<=0){burst(e.position,e.userData.type=='brute'?0xff5e86:0xffad55,12);gold+=e.userData.type=='brute'?7:4;xp++;if(xp>=nextXP){xp-=nextXP;level++;nextXP+=4;openLevel()}scene.remove(e);enemies.splice(j,1)}if(b.userData.pierce<=0)remove=true;else b.userData.pierce--;break}}if(remove||b.userData.life<=0){scene.remove(b);bullets.splice(i,1)}}
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];const d=new THREE.Vector3(player.position.x-e.position.x,0,player.position.z-e.position.z),dist=d.length();d.normalize();if(dist>.8)e.position.addScaledVector(d,e.userData.speed*dt);e.lookAt(player.position.x,e.position.y,player.position.z);if(dist<1.15){e.userData.hit+=dt;if(e.userData.hit>.7){stats.hp-=e.userData.type=='brute'?18:10;e.userData.hit=0;burst(player.position,0xff4d78,5);if(stats.hp<=0){stats.hp=0;gameEnd()}}} }
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.position.addScaledVector(p.userData.vel,dt);p.userData.vel.y-=7*dt;p.userData.life-=dt;p.material.opacity=Math.max(0,p.userData.life/.6);if(p.userData.life<=0){scene.remove(p);particles.splice(i,1)}}
if(toSpawn===0&&enemies.length===0&&cl>1.8){cl=-100;openShop()}
updateHUD();}
const target=player.position.clone();camera.position.lerp(new THREE.Vector3(target.x+11,target.y+15,target.z+12),.06);camera.lookAt(target.x,target.y+.5,target.z);renderer.render(scene,camera)}camera.position.set(11,15,12);requestAnimationFrame(animate);
})();
</script></body></html>
