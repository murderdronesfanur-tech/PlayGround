<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/><title>Astro Core</title>
<style>
:root{--bg:#10172a;--panel:#192238;--panel2:#202d48;--cyan:#5dd6e8;--gold:#ffca5c;--red:#ef6673;--green:#66d49b;--ink:#edf7ff}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;user-select:none}.game{position:relative;width:100%;height:100%;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%}.top{position:absolute;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));height:58px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.resources{height:48px;display:flex;gap:6px;padding:5px 8px;background:rgba(18,27,48,.94);border:1px solid rgba(150,190,220,.14);border-radius:10px;box-shadow:0 5px 18px #070b1780}.res{min-width:64px;padding:4px 7px;border-right:1px solid #31415e}.res:last-child{border:0}.res-label{font-size:9px;letter-spacing:.12em;color:#91a3b9}.res-value{font-weight:800;font-size:16px}.wave{height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;background:rgba(18,27,48,.94);border:1px solid rgba(150,190,220,.14);border-radius:10px}.wave strong{color:var(--gold);font-size:18px}.pause{width:42px;height:42px;border:0;border-radius:9px;background:#263650;color:#fff;font-size:19px}.bottom{position:absolute;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none}.buildbar{pointer-events:auto;height:78px;display:flex;align-items:center;gap:6px;padding:7px;background:rgba(18,27,48,.96);border:1px solid rgba(150,190,220,.15);border-radius:14px;box-shadow:0 8px 24px #070b17aa}.build{position:relative;width:62px;height:64px;border:0;border-radius:9px;background:#25334d;color:#dcecff;font-size:11px;padding:4px}.build.selected{outline:2px solid var(--cyan);background:#31516a}.build .icon{display:block;width:34px;height:34px;margin:0 auto 2px;border-radius:7px}.drill .icon{background:repeating-linear-gradient(45deg,#73b6c7 0 5px,#3a7183 5px 10px)}.belt .icon{background:linear-gradient(90deg,#7c8ba0 25%,#c2cad4 25% 50%,#7c8ba0 50% 75%,#c2cad4 75%);border:5px solid #4d5c70}.turret .icon{background:radial-gradient(circle,#ffd166 0 25%,#5d7c91 27% 48%,#37495e 50%)}.wall .icon{background:repeating-linear-gradient(90deg,#98aabd 0 8px,#71869c 8px 10px)}.power .icon{background:radial-gradient(circle,#71e0bc 0 28%,transparent 30%),linear-gradient(135deg,#3a7e75,#1f4f4f)}.build .cost{color:var(--gold);font-size:9px}.hint{position:absolute;bottom:98px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:7px;background:#0b1122bd;font-size:12px;opacity:0;transition:.2s;pointer-events:none}.hint.show{opacity:1}.joystick{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(96px,env(safe-area-inset-bottom));width:92px;height:92px;border-radius:50%;background:#1b294050;border:2px solid #85a1bd55;display:none}.joystick .knob{position:absolute;width:42px;height:42px;left:25px;top:25px;border-radius:50%;background:#7d9ab870;border:1px solid #b4c8d8}.modal{position:absolute;inset:0;background:#070b16cc;display:none;align-items:center;justify-content:center;z-index:5}.modal.open{display:flex}.card{width:min(360px,calc(100% - 32px));padding:24px;text-align:center;border-radius:16px;background:#19243a;border:1px solid #3b4e70}.card h1{margin:0 0 8px;font-size:28px}.card p{color:#aab8ca}.card button{border:0;border-radius:9px;padding:12px 18px;margin:5px;background:var(--cyan);color:#102033;font-weight:800}.toast{position:absolute;top:75px;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:8px;background:#ef6673;color:white;font-size:12px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(pointer:fine){.joystick{display:block}}
@media(max-width:620px){.res{min-width:54px}.resources{gap:2px}.build{width:56px}.buildbar{height:72px}.top{height:52px}.wave{gap:5px;padding:0 8px}.wave div span{display:none}.joystick{display:block}}@media(max-width:430px){.top{left:6px;right:6px}.resources{padding:4px}.res{min-width:47px;padding:3px}.res-label{display:none}.wave{height:44px}.pause{width:38px;height:38px}.buildbar{gap:3px}.build{width:52px}.buildbar{max-width:calc(100vw - 16px)} }
</style>
</head>
<body><div class="game" id="game"><canvas id="canvas"></canvas><div class="top"><div class="resources"><div class="res"><div class="res-label">МЕДЬ</div><div class="res-value" id="copper">220</div></div><div class="res"><div class="res-label">СВИНЕЦ</div><div class="res-value" id="lead">120</div></div><div class="res"><div class="res-label">ЭНЕРГИЯ</div><div class="res-value" id="power">0</div></div></div><div class="wave"><div>ВОЛНА <strong id="wave">1</strong></div><span id="timer">01:30</span><button class="pause" id="pause">Ⅱ</button></div></div><div class="joystick" id="stick"><div class="knob" id="knob"></div></div><div class="hint" id="hint"></div><div class="bottom"><div class="buildbar"><button class="build drill selected" data-type="drill"><i class="icon"></i>БУР<div class="cost">25 медь</div></button><button class="build belt" data-type="belt"><i class="icon"></i>КОНВ.<div class="cost">10 медь</div></button><button class="build turret" data-type="turret"><i class="icon"></i>БАШНЯ<div class="cost">80 свинец</div></button><button class="build wall" data-type="wall"><i class="icon"></i>СТЕНА<div class="cost">15 медь</div></button><button class="build power" data-type="power"><i class="icon"></i>УЗЕЛ<div class="cost">30 медь</div></button></div></div><div class="toast" id="toast">Недостаточно ресурсов</div><div class="modal open" id="modal"><div class="card"><h1>ASTRO CORE</h1><p>Защити ядро от трёх волн врагов. Добывай руды, строй бур и башни.</p><button id="start">НАЧАТЬ</button></div></div></div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),game=document.getElementById('game');let W,H,DPR,cam={x:0,y:0},player={x:0,y:0,r:12,angle:0,hp:100},selected='drill',started=false,paused=false,wave=1,waveTime=90,won=false,gameover=false;
let copper=220,lead=120,blocks=[],enemies=[],shots=[],particles=[],ores=[];const tile=48;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function rng(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
for(let y=-8;y<=8;y++)for(let x=-8;x<=8;x++){if(rng(x*31+y*73)>.82){ores.push({x:x*tile+tile/2,y:y*tile+tile/2,type:rng(x+y*7)>.45?'copper':'lead'})}}
blocks.push({type:'core',gx:0,gy:0,x:0,y:0,hp:1000});
function world(p){return{x:p.x-cam.x+W/2,y:p.y-cam.y+H/2}}
function gridpos(x,y){return{x:Math.round(x/tile)*tile,y:Math.round(y/tile)*tile,gx:Math.round(x/tile),gy:Math.round(y/tile)}}
function color(v){return v?'#66d49b':'#ef6673'}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1200)}
function blockCost(t){return t==='drill'||t==='belt'||t==='wall'||t==='power'?['copper',t==='drill'?25:t==='belt'?10:t==='wall'?15:30]:['lead',80]}
function onBuild(e){if(!started||paused)return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left-W/2+cam.x,y=e.clientY-r.top-H/2+cam.y,g=gridpos(x,y);if(Math.hypot(g.x,g.y)<80)return;if(blocks.find(b=>b.gx===g.gx&&b.gy===g.gy)){toast('Место занято');return}let [res,cost]=blockCost(selected);if((res==='copper'?copper:lead)<cost){toast('Недостаточно ресурсов');return}if(res==='copper')copper-=cost;else lead-=cost;blocks.push({type:selected,gx:g.gx,gy:g.gy,x:g.x,y:g.y,hp:selected==='wall'?180:selected==='turret'?120:100,shot:0,active:true});burst(g.x,g.y,'#88eaff',8)}
canvas.addEventListener('pointerdown',onBuild);
document.querySelectorAll('.build').forEach(b=>b.onclick=()=>{selected=b.dataset.type;document.querySelectorAll('.build').forEach(q=>q.classList.remove('selected'));b.classList.add('selected')});
document.getElementById('start').onclick=()=>{document.getElementById('modal').classList.remove('open');started=true};document.getElementById('pause').onclick=()=>{if(!started||gameover||won)return;paused=!paused;document.getElementById('pause').textContent=paused?'▶':'Ⅱ'};
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=!0);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=!1);
let stick={active:false,id:null,x:0,y:0};const stickEl=document.getElementById('stick'),knob=document.getElementById('knob');
stickEl.addEventListener('pointerdown',e=>{stick.active=true;stick.id=e.pointerId;stickEl.setPointerCapture(e.pointerId)});addEventListener('pointermove',e=>{if(!stick.active||e.pointerId!==stick.id)return;let r=stickEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),m=Math.min(d,34);stick.x=dx/d*m||0;stick.y=dy/d*m||0;knob.style.transform=`translate(${stick.x}px,${stick.y}px)`});addEventListener('pointerup',()=>{stick.active=false;stick.x=0;stick.y=0;knob.style.transform=''});
function burst(x,y,c,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-0.5)*100,vy:(Math.random()-0.5)*100,life:.5,c})}
function spawnWave(){let count=5+wave*3;for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2,r=560+Math.random()*180;enemies.push({x:Math.cos(a)*r,y:Math.sin(a)*r,r:10,hp:35+wave*18,speed:28+wave*3,phase:Math.random()*6})}}
spawnWave();let last=performance.now(),spawnWait=0;
function update(dt){if(!started||paused||gameover||won)return;let dx=0,dy=0;if(keys['w']||keys['arrowup'])dy--;if(keys['s']||keys['arrowdown'])dy++;if(keys['a']||keys['arrowleft'])dx--;if(keys['d']||keys['arrowright'])dx++;dx+=stick.x/34;dy+=stick.y/34;let d=Math.hypot(dx,dy);if(d){dx/=d;dy/=d;player.x+=dx*170*dt;player.y+=dy*170*dt;player.angle=Math.atan2(dy,dx)}cam.x+=(player.x-cam.x)*Math.min(1,dt*5);cam.y+=(player.y-cam.y)*Math.min(1,dt*5);
// resource income
for(const b of blocks){if(b.type==='drill'){let ore=ores.find(o=>Math.abs(o.x-b.x)<tile*.6&&Math.abs(o.y-b.y)<tile*.6);if(ore)b.timer=(b.timer||0)+dt;if(ore&&(b.timer||0)>2){b.timer=0;if(ore.type==='copper')copper++;else lead++}}if(b.type==='turret'){b.shot-=dt;if(b.shot<=0){let e=enemies.find(e=>Math.hypot(e.x-b.x,e.y-b.y)<220);if(e){let a=Math.atan2(e.y-b.y,e.x-b.x);shots.push({x:b.x,y:b.y,vx:Math.cos(a)*280,vy:Math.sin(a)*280,life:1.2,dmg:16+wave*3});b.shot=.45}}}}
for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];if(Math.hypot(s.x-e.x,s.y-e.y)<e.r+5){e.hp-=s.dmg;s.life=0;burst(s.x,s.y,'#ffcf70',3);if(e.hp<=0){burst(e.x,e.y,'#ef6673',10);enemies.splice(j,1);copper+=3}break}}if(s.life<=0)shots.splice(i,1)}
for(const e of enemies){let tx=0,ty=0;if(blocks.length){let targets=blocks.filter(b=>b.type!=='belt');let b=targets.sort((a,b)=>Math.hypot(a.x-e.x,a.y-e.y)-Math.hypot(b.x-e.x,b.y-e.y))[0];tx=b.x;ty=b.y}else{tx=player.x;ty=player.y}let a=Math.atan2(ty-e.y,tx-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;if(Math.hypot(e.x,e.y)<35){for(const b of blocks){if(b.type==='core'&&Math.hypot(e.x-b.x,e.y-b.y)<45){b.hp-=20*dt}}}} 
let core=blocks.find(b=>b.type==='core');if(core&&core.hp<=0)gameover=true;
for(const b of blocks){if(b.type==='core')continue;if(enemies.some(e=>Math.hypot(e.x-b.x,e.y-b.y)<22&&b.hp!==undefined)){let near=enemies.find(e=>Math.hypot(e.x-b.x,e.y-b.y)<22);if(near){b.hp-=25*dt;if(b.hp<=0){burst(b.x,b.y,'#ef6673',12);blocks.splice(blocks.indexOf(b),1)}}}}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
waveTime-=dt;if(waveTime<=0){if(wave<3){wave++;waveTime=75;spawnWave();toast('Волна '+wave)}else if(enemies.length===0)won=true}if(wave===1&&enemies.length===0&&waveTime>65){};
 document.getElementById('copper').textContent=copper;document.getElementById('lead').textContent=lead;document.getElementById('power').textContent=blocks.filter(b=>b.type==='power').length*20;document.getElementById('wave').textContent=wave;document.getElementById('timer').textContent=`${String(Math.floor(waveTime/60)).padStart(2,'0')}:${String(Math.floor(waveTime%60)).padStart(2,'0')}`}
function drawTile(p){let o=world(p);ctx.fillStyle='#17233a';ctx.fillRect(o.x-tile/2,o.y-tile/2,tile-.5,tile-.5);ctx.strokeStyle='#20304a';ctx.lineWidth=1;ctx.strokeRect(o.x-tile/2,o.y-tile/2,tile-.5,tile-.5)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#11182a';ctx.fillRect(0,0,W,H);let startx=Math.floor((cam.x-W/2)/tile)-1,endx=Math.ceil((cam.x+W/2)/tile)+1,starty=Math.floor((cam.y-H/2)/tile)-1,endy=Math.ceil((cam.y+H/2)/tile)+1;for(let y=starty;y<=endy;y++)for(let x=startx;x<=endx;x++){let n=rng(x*99+y*37);drawTile({x:x*tile,y:y*tile});if(n>.94){let p=world({x:x*tile,y:y*tile});ctx.fillStyle='#25334a';ctx.fillRect(p.x-7,p.y-5,14,10)}}
for(const o of ores){let p=world(o);ctx.fillStyle=o.type==='copper'?'#65b7c8':'#cb728b';ctx.beginPath();ctx.moveTo(p.x-13,p.y-7);ctx.lineTo(p.x-3,p.y-13);ctx.lineTo(p.x+11,p.y-5);ctx.lineTo(p.x+6,p.y+12);ctx.lineTo(p.x-10,p.y+8);ctx.fill();ctx.fillStyle='#bfe7ef';ctx.globalAlpha=.6;ctx.fillRect(p.x-5,p.y-7,5,5);ctx.globalAlpha=1}
for(const b of blocks){let p=world(b);if(b.type==='core'){ctx.fillStyle='#d5eff3';ctx.fillRect(p.x-23,p.y-23,46,46);ctx.fillStyle='#5aa8b5';ctx.fillRect(p.x-16,p.y-16,32,32);ctx.fillStyle='#aee9e9';ctx.beginPath();ctx.arc(p.x,p.y,9,0,7);ctx.fill();ctx.fillStyle='#ffce66';ctx.fillRect(p.x-2,p.y-26,4,8)}else if(b.type==='drill'){ctx.fillStyle='#4d7182';ctx.fillRect(p.x-18,p.y-18,36,36);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(performance.now()/700);ctx.fillStyle='#93cad2';ctx.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4;ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*17,Math.sin(a)*17)}ctx.strokeStyle='#b4eff4';ctx.lineWidth=4;ctx.stroke();ctx.restore()}else if(b.type==='belt'){ctx.fillStyle='#66778e';ctx.fillRect(p.x-20,p.y-20,40,40);ctx.strokeStyle='#b0bcc9';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(p.x-15,p.y);ctx.lineTo(p.x+15,p.y);ctx.stroke()}else if(b.type==='turret'){ctx.fillStyle='#536a7a';ctx.beginPath();ctx.arc(p.x,p.y,19,0,7);ctx.fill();ctx.fillStyle='#ffd36b';ctx.beginPath();ctx.arc(p.x,p.y,8,0,7);ctx.fill();ctx.strokeStyle='#d7e5e6';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+18,p.y);ctx.stroke()}else if(b.type==='wall'){ctx.fillStyle='#91a8bc';ctx.fillRect(p.x-20,p.y-20,40,40);ctx.fillStyle='#6f8398';ctx.fillRect(p.x-16,p.y-16,32,32);ctx.strokeStyle='#bdcddd';ctx.strokeRect(p.x-20,p.y-20,40,40)}else if(b.type==='power'){ctx.fillStyle='#315f60';ctx.beginPath();ctx.arc(p.x,p.y,20,0,7);ctx.fill();ctx.strokeStyle='#71e0bc';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,10,0,7);ctx.stroke()}if(b.hp<=(b.type==='wall'?180:b.type==='turret'?120:b.type==='core'?1000:100)*(b.type==='core'?1:.45)&&b.type!=='core'){ctx.fillStyle='#ef6673';ctx.fillRect(p.x-20,p.y-25,40*(b.hp/(b.type==='wall'?180:120)),4)}}
for(const s of shots){let p=world(s);ctx.fillStyle='#ffd36b';ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill()}for(const e of enemies){let p=world(e);ctx.fillStyle='#d85969';ctx.beginPath();ctx.moveTo(p.x,p.y-14);ctx.lineTo(p.x+13,p.y+10);ctx.lineTo(p.x-13,p.y+10);ctx.closePath();ctx.fill();ctx.fillStyle='#ffb2a6';ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();ctx.fillStyle='#342;'}for(const p of particles){let q=world(p);ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.c;ctx.fillRect(q.x-2,q.y-2,4,4)}ctx.globalAlpha=1;
let pp=world(player);ctx.save();ctx.translate(pp.x,pp.y);ctx.rotate(player.angle);ctx.fillStyle='#66d49b';ctx.beginPath();ctx.moveTo(17,0);ctx.lineTo(-10,-10);ctx.lineTo(-6,0);ctx.lineTo(-10,10);ctx.closePath();ctx.fill();ctx.restore();if(gameover||won){ctx.fillStyle='#070b16cc';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 32px system-ui';ctx.fillText(won?'ПОБЕДА!':'ЯДРО УНИЧТОЖЕНО',W/2,H/2-10);ctx.font='16px system-ui';ctx.fillText('Обновите страницу для новой игры',W/2,H/2+25)}}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
